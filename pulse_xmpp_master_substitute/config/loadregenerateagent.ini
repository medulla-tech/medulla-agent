[parameters]
# Active le scheduler qui traite la file xmppmaster.regenerate_agent.
regenerate_queue_scan_enabled = True

# Intervalle de scrutation de la file, en secondes. Le plugin impose 10 s minimum.
regenerate_queue_scan_interval = 20

# Nombre maximal de machines presentes envoyees dans un lot vers le meme ARS.
# L'ARS traite ensuite les machines du lot sequentiellement.
regenerate_queue_batch_size = 5
